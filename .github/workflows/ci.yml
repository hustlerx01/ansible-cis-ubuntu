name: ci
on: [push, pull_request]
jobs:
  lint-and-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ansible-core pytest ansible-lint
      - run: ansible-lint roles/cis_ubuntu
      - run: pytest -q
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cis-test . && docker run --rm cis-test
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ansible-core "molecule>=24" "molecule-plugins[docker]"
      - run: cd roles/cis_ubuntu && molecule test
