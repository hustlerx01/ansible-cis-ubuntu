---
- name: Ensure config dirs exist
  ansible.builtin.file: {path: "{{ cis_ubuntu_root }}/{{ item }}", state: directory, mode: "0755"}
  loop: [etc/modprobe.d, etc/sysctl.d, etc/ssh/sshd_config.d, etc/security/limits.d, etc/audit/rules.d]

- name: "1.1.1 Disable unused filesystems / 3.5 uncommon protocols"
  ansible.builtin.template: {src: cis-modprobe.conf.j2, dest: "{{ cis_ubuntu_root }}/etc/modprobe.d/60-cis.conf", mode: "0644"}
  tags: [cis_1_1_1]

- name: "1.5.1 / 3.x Kernel & network sysctls"
  ansible.builtin.template: {src: cis-sysctl.conf.j2, dest: "{{ cis_ubuntu_root }}/etc/sysctl.d/60-cis.conf", mode: "0644"}
  notify: Reload sysctl
  tags: [cis_3]

- name: "1.5.3 Restrict core dumps"
  ansible.builtin.copy: {dest: "{{ cis_ubuntu_root }}/etc/security/limits.d/60-cis.conf", content: "* hard core 0\n", mode: "0644"}

- name: "5.2.x SSH daemon hardening (drop-in)"
  ansible.builtin.template: {src: cis-sshd.conf.j2, dest: "{{ cis_ubuntu_root }}/etc/ssh/sshd_config.d/60-cis.conf", mode: "0600"}
  notify: Reload sshd
  tags: [cis_5_2]

- name: "5.2.x Ensure sshd_config includes drop-ins"
  ansible.builtin.lineinfile:
    path: "{{ cis_ubuntu_root }}/etc/ssh/sshd_config"
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    create: true
    mode: "0600"

- name: "5.2.1 Permissions on sshd_config"
  ansible.builtin.file: {path: "{{ cis_ubuntu_root }}/etc/ssh/sshd_config", mode: "0600"}

- name: "5.5.1 Password aging in login.defs"
  ansible.builtin.lineinfile:
    path: "{{ cis_ubuntu_root }}/etc/login.defs"
    regexp: "^{{ item.k }}\\s"
    line: "{{ item.k }}\t{{ item.v }}"
    create: true
    mode: "0644"
  loop:
    - {k: PASS_MAX_DAYS, v: "{{ cis_ubuntu_pass_max_days }}"}
    - {k: PASS_MIN_DAYS, v: "{{ cis_ubuntu_pass_min_days }}"}
    - {k: PASS_WARN_AGE, v: "{{ cis_ubuntu_pass_warn_age }}"}
  tags: [cis_5_5]

- name: "1.7 Warning banners"
  ansible.builtin.copy: {dest: "{{ cis_ubuntu_root }}/etc/{{ item }}", content: "{{ cis_ubuntu_banner }}\n", mode: "0644"}
  loop: [issue, issue.net]

- name: "6.1.x Permissions on critical files (only if present)"
  ansible.builtin.stat: {path: "{{ cis_ubuntu_root }}/etc/{{ item.f }}"}
  loop: &perms
    - {f: passwd, m: "0644"}
    - {f: group, m: "0644"}
    - {f: shadow, m: "0640"}
    - {f: gshadow, m: "0640"}
  register: cis_ubuntu_crit

- name: "6.1.x Fix permissions on present critical files"
  ansible.builtin.file: {path: "{{ cis_ubuntu_root }}/etc/{{ item.item.f }}", mode: "{{ item.item.m }}"}
  loop: "{{ cis_ubuntu_crit.results }}"
  loop_control: {label: "{{ item.item.f }}"}
  when: item.stat.exists

- name: "4.1.3 auditd rules (identity, sudoers, time-change)"
  ansible.builtin.template: {src: cis-audit.rules.j2, dest: "{{ cis_ubuntu_root }}/etc/audit/rules.d/60-cis.rules", mode: "0640"}
