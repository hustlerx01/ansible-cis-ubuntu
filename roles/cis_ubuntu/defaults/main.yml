# cis_ubuntu_root lets the role target a mounted image / test rootfs. "/" = real host.
cis_ubuntu_root: "/"
cis_ubuntu_apply_live: "{{ cis_ubuntu_root == '/' }}"   # only reload sysctl/sshd on a real host
cis_ubuntu_disable_modules: [cramfs, freevxfs, hfs, hfsplus, jffs2, udf, usb-storage, dccp, sctp, rds, tipc]
cis_ubuntu_sysctl:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  kernel.randomize_va_space: 2
  fs.suid_dumpable: 0
cis_ubuntu_sshd:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  PermitEmptyPasswords: "no"
  X11Forwarding: "no"
  MaxAuthTries: "4"
  LoginGraceTime: "60"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "3"
  IgnoreRhosts: "yes"
  HostbasedAuthentication: "no"
  LogLevel: "VERBOSE"
  Banner: "/etc/issue.net"
cis_ubuntu_pass_max_days: 365
cis_ubuntu_pass_min_days: 1
cis_ubuntu_pass_warn_age: 7
cis_ubuntu_banner: "Authorized users only. All activity may be monitored and reported."
